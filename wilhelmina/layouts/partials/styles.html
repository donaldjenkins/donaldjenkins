{{ $opts := dict "transpiler" "dartsass" "targetPath" "css/main.css" "includePaths" (slice "node_modules") }}
{{ $css := resources.Get "sass/main.scss" | toCSS $opts }}
{{ if hugo.IsProduction }}
  {{ $css = $css | postCSS | minify | fingerprint }}
{{ end }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}"{{ if hugo.IsProduction }} integrity="{{ $css.Data.Integrity }}"{{ end }}>
