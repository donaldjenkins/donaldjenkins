<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>404 Not Found</title>
    <!-- Genuine 404 responses are excluded from search by their status code
         alone. This tag is for /404 itself, which is a real URL and answers
         200, so nothing else would keep it out of the index. -->
    <meta name="robots" content="noindex" />
    <style>
      /* The six normalize.css 5.0.0 rules this page actually uses, inlined so
         the page makes no third-party request. figure{margin:1em 40px} is what
         positions the logo — do not drop it. */
      html {
        font-family: sans-serif;
        line-height: 1.15;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
      }
      figure {
        display: block;
        margin: 1em 40px;
      }
      a {
        background-color: transparent;
      }
      img {
        border-style: none;
      }
    </style>
    <link rel="stylesheet" href="/css/404.css" />
  </head>
  <body>
    <div id="oopss">
      <figure id="logo">
        <a href="/" title="Home">
          <img
            src="/images/logo.svg"
            alt="Donald Jenkins"
            title="Donald Jenkins"
            width="210"
            height="50"
        /></a>
      </figure>
      <div id="error-text">
        <img src="https://assets.via.dj/images/system/404.svg" alt="404" />
        <span>Uh oh.</span>
        <p class="p-a">
          Better just get
          <a href="/">out</a> of here...
        </p>
        <p class="p-b"></p>
      </div>
    </div>
  </body>
</html>
